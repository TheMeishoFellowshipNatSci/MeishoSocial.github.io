name: Sync public timeline
on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: curl -fsSL "$GASSHO_EXPORT_URL" -o data/public.json
        env:
          GASSHO_EXPORT_URL: ${{ secrets.GASSHO_EXPORT_URL }}
      - run: |
          python -m json.tool data/public.json >/dev/null
          git config user.name meisho-social-bot
          git config user.email actions@users.noreply.github.com
          git add data/public.json
          git diff --cached --quiet || (git commit -m "chore: sync timeline" && git pus
