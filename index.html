<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ff8200"><title>Meisho Social</title><link rel="stylesheet" href="./assets/style.css"><script src="https://accounts.google.com/gsi/client" async defer></script><script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js" defer></script><script src="./config.js"></script><script src="./assets/app.js" defer></script></head><body>
<div class="accent"></div><header><button class="brand" data-view="general"><span class="logo">M</span><b>Meisho Social</b></button><label class="search"><i data-lucide="search"></i><input id="search" placeholder="正行・同志・話題を検索"></label><button id="account">ログイン</button></header>
<div class="shell"><nav><button data-view="general" class="active"><i data-lucide="home"></i>総合</button><button data-view="humanities"><i data-lucide="globe-2"></i>人文社会学系統</button><button data-view="science"><i data-lucide="flask-conical"></i>自然科学系統</button><button data-view="topics"><i data-lucide="hash"></i>話題</button><button data-view="profile"><i data-lucide="circle-user"></i>私</button></nav>
<main><section id="loginCard" class="card welcome"><div><h1>Meisho Social</h1><p>明照の同志による社会通信基盤</p></div><div id="googleButton"></div></section>
<section id="composer" class="card" hidden><div class="compose-top"><b>正行</b><span id="remaining">2000</span></div><textarea id="postBody" maxlength="2000" placeholder="#話題# を付けて正行する"></textarea><div class="compose-bottom"><select id="channel"><option value="general">総合</option><option value="humanities">人文社会学系統</option><option value="science">自然科学系統</option></select><button id="publish" class="primary">安全審査へ</button></div></section>
<div id="notice" hidden></div><section id="feed"></section><section id="topics" class="card page" hidden><h1>話題</h1><div id="topicGrid"></div></section><section id="profile" class="card page" hidden></section></main>
<aside><section class="card profile-mini" id="mini"><div class="avatar">M</div><b>ゲスト</b><small>ログインして参加</small><div class="stats"><span><b>–</b><small>同志</small></span><span><b>–</b><small>正行</small></span></div></section><section class="card"><h2>固定公式アカウント</h2><div id="official"></div></section></aside></div>
<div class="modal" id="registerModal" hidden><form class="dialog" id="registerForm"><h2>同志登録</h2><label>ペンネーム<input id="regName" maxlength="30" required></label><label>Meisho ID<input id="regHandle" maxlength="24" placeholder="英小文字・数字・_" required></label><label>元素会員番号<input id="regNumber" required></label><button class="primary">登録する</button></form></div>
<div class="modal" id="replyModal" hidden><form class="dialog" id="replyForm"><button type="button" class="x" data-close>×</button><h2>返信</h2><div id="replyQuote"></div><textarea id="replyBody" maxlength="2000" required></textarea><button class="primary">返信する</button></form></div>
<div class="modal" id="profileModal" hidden><form class="dialog" id="profileForm"><button type="button" class="x" data-close>×</button><h2>プロフィール編集</h2><div class="preview"><img id="avatarPreview" alt=""></div><label>アイコン<input id="avatarInput" type="file" accept="image/png,image/jpeg,image/webp"></label><label>ペンネーム<input id="editName" maxlength="30"></label><label>自己紹介<textarea id="editBio" maxlength="160"></textarea></label><button class="primary">保存</button></form></div>
<div class="modal" id="frozenModal" hidden><div class="dialog"><h2>アカウントは凍結されています</h2><p>利用再開の審査を希望する場合は、異議申し立てページをご利用ください。</p><a id="appealLink" class="primary" href="#">異議申し立てページ</a></div></div>
<iframe id="bridge" title="Meisho API" hidden></iframe></body></html>
